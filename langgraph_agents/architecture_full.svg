<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>

  <!-- Phase containers -->
  <rect x="20" y="40" width="220" height="440" rx="14" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
  <text x="130" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#0C447C">1. SCOPE</text>
  <rect x="270" y="40" width="440" height="440" rx="14" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="490" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#3C3489">2. RESEARCH</text>
  <rect x="740" y="40" width="200" height="440" rx="14" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="840" y="68" text-anchor="middle" font-size="15" font-weight="bold" fill="#085041">3. WRITE</text>

  <!-- Phase 1 -->
  <rect x="45" y="90" width="170" height="50" rx="8" fill="#fff" stroke="#378ADD"/>
  <text x="130" y="120" text-anchor="middle" font-size="13" fill="#222">User research topic</text>
  <line x1="130" y1="140" x2="130" y2="185" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="45" y="185" width="170" height="60" rx="8" fill="#fff" stroke="#378ADD"/>
  <text x="130" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">User Clarification</text>
  <text x="130" y="230" text-anchor="middle" font-size="11" fill="#555">ask up to 2 questions if vague</text>
  <line x1="130" y1="245" x2="130" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="45" y="300" width="170" height="60" rx="8" fill="#fff" stroke="#378ADD"/>
  <text x="130" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Research Brief</text>
  <text x="130" y="345" text-anchor="middle" font-size="11" fill="#555">chat → focused brief</text>

  <!-- Brief to supervisor -->
  <path d="M215 330 H255 V115 H400" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="250" y="210" text-anchor="middle" font-size="11" fill="#555" transform="rotate(-90 250 210)">brief</text>

  <!-- Supervisor -->
  <rect x="400" y="85" width="180" height="60" rx="8" fill="#fff" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="490" y="110" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Research Supervisor</text>
  <text x="490" y="129" text-anchor="middle" font-size="11" fill="#555">split, delegate, check gaps</text>

  <!-- Supervisor to sub-agents -->
  <line x1="440" y1="145" x2="350" y2="215" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="490" y1="145" x2="490" y2="215" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="540" y1="145" x2="630" y2="215" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="372" y="172" font-size="11" fill="#555">topics</text>

  <!-- Sub-agents -->
  <g>
    <rect x="290" y="220" width="120" height="115" rx="8" fill="#fff" stroke="#7F77DD"/>
    <text x="350" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Sub-agent 1</text>
    <rect x="305" y="255" width="90" height="28" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
    <text x="350" y="273" text-anchor="middle" font-size="12" fill="#222">LLM</text>
    <line x1="350" y1="285" x2="350" y2="300" stroke="#333" stroke-width="1.3" marker-start="url(#a)" marker-end="url(#a)"/>
    <rect x="305" y="302" width="90" height="26" rx="6" fill="#FAEEDA" stroke="#BA7517"/>
    <text x="350" y="319" text-anchor="middle" font-size="12" fill="#222">Paper search</text>
  </g>
  <g>
    <rect x="430" y="220" width="120" height="115" rx="8" fill="#fff" stroke="#7F77DD"/>
    <text x="490" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Sub-agent 2</text>
    <rect x="445" y="255" width="90" height="28" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
    <text x="490" y="273" text-anchor="middle" font-size="12" fill="#222">LLM</text>
    <line x1="490" y1="285" x2="490" y2="300" stroke="#333" stroke-width="1.3" marker-start="url(#a)" marker-end="url(#a)"/>
    <rect x="445" y="302" width="90" height="26" rx="6" fill="#FAEEDA" stroke="#BA7517"/>
    <text x="490" y="319" text-anchor="middle" font-size="12" fill="#222">Paper search</text>
  </g>
  <g>
    <rect x="570" y="220" width="120" height="115" rx="8" fill="#fff" stroke="#7F77DD"/>
    <text x="630" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Sub-agent N</text>
    <rect x="585" y="255" width="90" height="28" rx="6" fill="#EEEDFE" stroke="#7F77DD"/>
    <text x="630" y="273" text-anchor="middle" font-size="12" fill="#222">LLM</text>
    <line x1="630" y1="285" x2="630" y2="300" stroke="#333" stroke-width="1.3" marker-start="url(#a)" marker-end="url(#a)"/>
    <rect x="585" y="302" width="90" height="26" rx="6" fill="#FAEEDA" stroke="#BA7517"/>
    <text x="630" y="319" text-anchor="middle" font-size="12" fill="#222">Paper search</text>
  </g>

  <!-- Sub-agents to cleanup -->
  <line x1="350" y1="335" x2="350" y2="375" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="490" y1="335" x2="490" y2="375" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="630" y1="335" x2="630" y2="375" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Cleanup -->
  <rect x="290" y="375" width="400" height="45" rx="8" fill="#fff" stroke="#7F77DD"/>
  <text x="490" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Findings Cleanup (1 LLM call per sub-agent)</text>
  <text x="490" y="412" text-anchor="middle" font-size="11" fill="#555">cited answer, no raw results</text>

  <!-- Findings back to supervisor -->
  <path d="M690 397 H700 V115 H580" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="684" y="104" text-anchor="end" font-size="11" fill="#555">findings</text>

  <!-- Gap loop note -->
  <rect x="290" y="435" width="400" height="30" rx="6" fill="#fff" stroke="#7F77DD" stroke-dasharray="4 3"/>
  <text x="490" y="454" text-anchor="middle" font-size="12" fill="#3C3489">gaps found? spawn more sub-agents (max 2 rounds)</text>

  <!-- Supervisor to writer -->
  <line x1="710" y1="230" x2="760" y2="230" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="735" y="222" text-anchor="middle" font-size="11" fill="#555">enough</text>

  <!-- Phase 3 -->
  <rect x="760" y="190" width="160" height="80" rx="8" fill="#fff" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="840" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Report Writer</text>
  <text x="840" y="238" text-anchor="middle" font-size="11" fill="#555">one LLM call:</text>
  <text x="840" y="254" text-anchor="middle" font-size="11" fill="#555">brief + all findings</text>
  <line x1="840" y1="270" x2="840" y2="330" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="760" y="330" width="160" height="70" rx="8" fill="#fff" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="840" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Final Report</text>
  <text x="840" y="378" text-anchor="middle" font-size="11" fill="#555">literature review + references</text>
</svg>
